[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fea-translator"
version = "2026.10.19.1"
description = "FEA studies (part, material, supports, loads) to Gmsh meshes, CalculiX decks and checked results; MCP server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nicola Ferralis", email = "ferralis@generalflash.com" }]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
# PyPI has no Gmsh wheels for Linux on ARM (aarch64): there, install python3-gmsh with apt and link
# gmsh.py into the venv (README, Install)
mesh = ["gmsh>=4.11; sys_platform != 'linux' or platform_machine != 'aarch64'"]
mcp = ["mcp>=1.2"]
test = ["pytest"]

[project.scripts]
feat = "fea_translator.cli:main"
feat-mcp = "fea_translator.mcp_server:main"

[tool.setuptools]
packages = ["fea_translator"]

[tool.pytest.ini_options]
# lib3mf (a build123d dependency) warns about ctypes layouts under Python 3.14: not ours, harmless
filterwarnings = ["ignore::DeprecationWarning:lib3mf.*"]
