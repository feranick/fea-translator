[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fea-translator"
version = "2026.10.16.1"
description = "FEA studies (part, material, supports, loads) to Gmsh meshes, CalculiX decks and checked results; MCP server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nicola Ferralis", email = "ferralis@generalflash.com" }]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
mesh = ["gmsh>=4.11"]
mcp = ["mcp>=1.2"]
test = ["pytest"]

[project.scripts]
feat = "fea_translator.cli:main"
feat-mcp = "fea_translator.mcp_server:main"

[tool.setuptools]
packages = ["fea_translator"]
